<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Clock</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">
    <h1 class="text-4xl font-bold mb-6 text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400">
        World Clock
    </h1>

    <nav class="mb-10 flex gap-4">
        <button id="show-clocks" class="px-6 py-2 rounded-full bg-blue-600 hover:bg-blue-500 transition-colors font-semibold shadow-lg">Clocks</button>
        <button id="show-game" class="px-6 py-2 rounded-full bg-slate-700 hover:bg-slate-600 transition-colors font-semibold shadow-lg">Snake Game</button>
    </nav>

    <div id="clock-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 w-full max-w-6xl">
        <!-- Clock cards will be injected here by JavaScript -->
    </div>

    <div id="game-container" class="hidden flex flex-col items-center">
        <canvas id="snake-canvas" width="400" height="400" class="border-4 border-slate-700 rounded-xl bg-slate-800 shadow-2xl"></canvas>
        <div class="mt-6 flex flex-wrap gap-8 items-center justify-center">
            <p class="text-2xl font-bold text-emerald-400">Score: <span id="game-score">0</span></p>
            <p class="text-2xl font-bold text-amber-400">High Score: <span id="high-score">0</span></p>
            <div class="flex gap-4">
                <button id="start-game" class="px-8 py-2 bg-emerald-600 hover:bg-emerald-500 rounded-lg font-bold transition-all transform hover:scale-105">Start New Game</button>
                <button id="pause-game" class="hidden px-8 py-2 bg-amber-600 hover:bg-amber-500 rounded-lg font-bold transition-all transform hover:scale-105">Pause</button>
            </div>
        </div>
        <p class="mt-4 text-slate-400 italic">Use Arrow Keys or WASD to move</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
